# Included by every location in nginx.conf. nginx only inherits `add_header` from the server block into
# locations that set none of their own, so the headers are repeated by include instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
