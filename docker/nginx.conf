server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # ticket files go up to 8 MB (the API enforces it); leave room for the form encoding
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Resolving at request time (not at startup) means nginx follows the API
  # container to its new address when it is restarted or redeployed.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    include /etc/nginx/security-headers.conf;
    set $api http://api:8787;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # hashed build output never changes: cache it for good
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # single-page app: every other path is served by index.html (the router takes over client-side)
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
